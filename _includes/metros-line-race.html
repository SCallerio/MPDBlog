<!--
  ECharts line race: cumulative meters drilled per company (Argentina).
  Drop into any post with:  {% include metros-line-race.html %}
  Data is regenerated with:  python script/process_metros_perforados.py
-->
<div style="margin: 30px 0;">
  <div id="metros-line-race" style="width:100%; height:560px;"></div>
  <div style="text-align:right; margin-top:8px;">
    <button id="metros-line-race-replay" type="button"
            style="font-family:Poppins,sans-serif; font-size:14px; padding:6px 14px; border:1px solid #A4A3A8; border-radius:6px; background:transparent; color:inherit; cursor:pointer;">
      ↻ Replay
    </button>
  </div>
  <p style="font-style:italic; color:#757575; font-size:14px; margin-top:6px;">
    Source: <a href="http://datos.energia.gob.ar/dataset/7ea2ac77-d7a0-4129-9fbf-6f1a25d94e21">Secretaría de Energía — Metros perforados</a>.
    Cumulative sum of monthly meters drilled (<code>cantidad</code>) per company (<code>idempresa</code>).
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<script src="{{ site.baseurl }}/assets/js/metrosPerforadosLineRace.js"></script>
<script>
  renderMetrosLineRace('metros-line-race', '{{ site.baseurl }}/data/processed/metros_perforados_cumsum.json');
</script>
