{%- comment -%}
  Responsive 16:9 YouTube embed.
  Usage: {% include youtube-embed.html id="VIDEO_ID" title="Accessible title" %}
{%- endcomment -%}
<div style="position:relative; width:100%; padding-bottom:56.25%; height:0; overflow:hidden; border-radius:8px; margin:1.5rem 0;">
  <iframe src="https://www.youtube.com/embed/{{ include.id }}"
          title="{{ include.title | default: 'YouTube video' }}"
          style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen></iframe>
</div>
