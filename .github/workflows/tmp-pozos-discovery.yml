name: TMP well/production dataset discovery

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-pozos-discovery.yml']

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: pip install -q pandas pyshp pyproj
      - name: Inspect datasets (metadata only)
        run: |
          B="http://datos.energia.gob.ar/dataset/c846e79c-026c-4040-897f-1ad3543b407c/resource"
          wget -q "$B/cb5c0f04-7835-45cd-b982-3e25ca7d7751/download/capitulo-iv-pozos.csv" -O pozos.csv
          wget -q "$B/3fcda0c5-68aa-4f33-bbe2-0180e6dbeebe/download/shapefile-de-pozos.zip" -O pozos.zip
          curl -sIL "$B/b5b58cdc-9e07-41f9-b392-fb9ec68b0725/download/produccin-de-pozos-de-gas-y-petrleo-no-convencional.csv" | grep -i "content-length\|content-type" || true
          wget -q "$B/b5b58cdc-9e07-41f9-b392-fb9ec68b0725/download/produccin-de-pozos-de-gas-y-petrleo-no-convencional.csv" -O prod.csv
          ls -la pozos.csv pozos.zip prod.csv
          unzip -o -q pozos.zip -d shp && find shp -type f | head -20 && cat shp/*.prj 2>/dev/null || find shp -name "*.prj" -exec cat {} \;
          python3 - <<'PY'
          import glob, json, urllib.request
          import pandas as pd, shapefile
          for name in ("pozos.csv", "prod.csv"):
              df = pd.read_csv(name, low_memory=False)
              print("\n=====", name, "ROWS", len(df))
              print("COLUMNS", list(df.columns))
              print("DTYPES", {c: str(t) for c, t in df.dtypes.items()})
              for c in df.columns:
                  if any(k in c.lower() for k in ("coord", "lat", "lon", "x", "y", "fecha", "anio", "tipo", "recurso", "estado")):
                      s = df[c]
                      print("COL", c, "nulls", int(s.isna().sum()), "min", s.min() if s.dtype != object else "-",
                            "max", s.max() if s.dtype != object else "-", "examples", s.dropna().astype(str).unique()[:5].tolist())
          for shp in glob.glob("shp/**/*.shp", recursive=True):
              r = shapefile.Reader(shp)
              print("\n===== SHP", shp, r.shapeTypeName, len(r), "records; bbox", [round(v, 3) for v in r.bbox])
              print("FIELDS", [f[0] for f in r.fields[1:]])
          def get(path):
              with urllib.request.urlopen("http://datos.energia.gob.ar/api/3/action/" + path, timeout=60) as r:
                  return json.load(r)["result"]
          for pid in ("c846e79c-026c-4040-897f-1ad3543b407c", "produccion-hidrocarburos-concesiones-de-explotacion"):
              p = get("package_show?id=" + pid)
              print("\nDATASET", p["title"])
              for res in p["resources"]:
                  print("RES", res["name"], "|", res["format"], "|", res["url"])
          PY
