name: TMP areas/blocks source discovery

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-areas-discovery.yml']

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: Install tools
        run: pip install -q pandas requests pyshp
      - name: Complete the sig.energia.gob.ar certificate chain (server omits the intermediate)
        run: |
          echo | openssl s_client -connect sig.energia.gob.ar:443 -servername sig.energia.gob.ar 2>/dev/null | openssl x509 > leaf.pem
          AIA=$(openssl x509 -in leaf.pem -noout -text | grep -A1 "CA Issuers" | grep -o 'http[^ ]*' | head -1)
          echo "Intermediate from AIA: $AIA"
          curl -s "$AIA" -o inter.der && (openssl x509 -inform DER -in inter.der -out inter.pem 2>/dev/null || cp inter.der inter.pem)
          python3 -c "import certifi; print(certifi.where())" > ca_path
          cat "$(cat ca_path)" inter.pem > bundle.pem
          openssl x509 -in inter.pem -noout -subject -issuer
      - name: Inspect Neuquén hydrocarbons GeoServer and the SIG /gis-api (metadata only)
        run: |
          python3 - <<'PY'
          import json, re
          import requests
          H = {"User-Agent": "Mozilla/5.0 (MPDBlog data discovery)"}
          def get(url, verify=True, **kw):
              try:
                  r = requests.get(url, headers=H, timeout=90, verify=verify, **kw)
                  print(f"\nGET {r.url} -> {r.status_code} {r.headers.get('content-type','')} {len(r.content)} bytes")
                  return r
              except Exception as e:
                  print(f"\nGET {url} -> ERROR {str(e)[:220]}")
                  return None

          print("=" * 20, "NEUQUEN GEOSERVER")
          for host in ["https://hidrocarburos.energianeuquen.gob.ar", "http://hidrocarburos.energianeuquen.gob.ar",
                       "https://hidrocarburos.energianeuquen.gov.ar"]:
              r = get(host + "/geoserver/wfs", params={"service": "WFS", "version": "2.0.0", "request": "GetCapabilities"})
              if r is None or not r.ok or b"FeatureType" not in r.content:
                  continue
              types = re.findall(r"<(?:wfs:)?FeatureType[^>]*>(.*?)</(?:wfs:)?FeatureType>", r.text, re.S)
              print("WFS feature types:", len(types))
              for t in types:
                  n = re.search(r"<(?:wfs:)?Name>([^<]+)", t); ti = re.search(r"<(?:wfs:)?Title>([^<]+)", t)
                  print("  ", n.group(1) if n else "", "|", ti.group(1) if ti else "")
              for layer in ["Hidrocarburos:Areas"]:
                  r = get(host + "/geoserver/wfs", params={"service": "WFS", "version": "2.0.0", "request": "GetFeature",
                                                           "typeNames": layer, "outputFormat": "application/json", "count": 3})
                  if r is not None and r.ok:
                      try:
                          j = r.json()
                          print("  totalFeatures", j.get("totalFeatures"), "numberMatched", j.get("numberMatched"), "crs", j.get("crs"))
                          for f in j["features"][:3]:
                              print("  PROPS", {k: str(v)[:60] for k, v in f["properties"].items()}, "GEOM", f["geometry"]["type"])
                      except Exception as e:
                          print("  not JSON", r.text[:300])
                  r = get(host + "/geoserver/wfs", params={"service": "WFS", "version": "2.0.0", "request": "GetFeature",
                                                           "typeNames": layer, "resultType": "hits"})
                  if r is not None and r.ok:
                      print("  HITS", re.findall(r'numberMatched="(\d+)"', r.text))
              break
          r = get("http://hidrocarburos.energianeuquen.gov.ar/gis")
          if r is not None and r.ok:
              text = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r.text))
              for kw in ("licen", "Licen", "uso", "Uso", "condicion", "Condicion", "término", "Término", "atribu", "CC "):
                  for m in list(re.finditer(kw, text))[:2]:
                      print("  GIS PAGE…", text[max(0, m.start() - 150): m.end() + 200])
              print("  GIS PAGE LINKS", sorted(set(re.findall(r'href="([^"]+(?:\.zip|\.kml|\.kmz|wfs|wms|shp)[^"]*)"', r.text)))[:30])

          print("\n" + "=" * 20, "SIG ENERGIA /gis-api")
          js = get("https://sig.energia.gob.ar/v/app.js", verify="bundle.pem")
          if js is not None and js.ok:
              t = js.text
              for m in list(re.finditer(r"gis-api", t))[:12]:
                  print("  CTX", t[max(0, m.start() - 160): m.end() + 220].replace("\n", " "))
          PY
