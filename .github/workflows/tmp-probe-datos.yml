name: TMP probe datos.gob.ar
on:
  push:
    branches: [claude/vibrant-galileo-h7ojk1]
    paths: ['.github/workflows/tmp-probe-datos.yml']
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Probe
        run: |
          set +e
          probe() { echo "=== $1"; curl -sS -L -m 60 -o out.bin -w "code=%{http_code} type=%{content_type} size=%{size_download} final=%{url_effective}\n" "$1"; head -c 400 out.bin | tr -c '[:print:]\n' '.'; echo; }
          probe "https://datos.gob.ar/dataset/energia-datos-fractura-pozos-hidrocarburos-adjunto-iv/archivo/energia_2280ad92-6ed3-403e-a095-50139863ab0d"
          grep -oE 'href="[^"]+\.(csv|zip)[^"]*"' out.bin | sort -u | head
          probe "https://datos.gob.ar"
          probe "https://datos.energia.gob.ar/"
          for id in energia-datos-fractura-pozos-hidrocarburos-adjunto-iv; do
            echo "=== package_show $id"
            curl -sS -m 60 "https://datos.gob.ar/api/3/action/package_show?id=$id" | python3 -c "import sys,json;d=json.load(sys.stdin)['result'];[print(r['id'],r.get('name'),r.get('url')) for r in d['resources']]"
          done
          for q in metros+perforados pozos+terminados pozos+en+perforacion produccion+pozos+no+convencional; do
            echo "=== package_search $q"
            curl -sS -m 60 "https://datos.gob.ar/api/3/action/package_search?q=$q&rows=5" | python3 -c "import sys,json
          for p in json.load(sys.stdin)['result']['results']:
              print('PKG',p['name'])
              for r in p['resources']: print('   ',r['id'],r.get('name'),r.get('url'))"
          done
