name: TMP CKAN resource discovery

on:
  push:
    branches: ['claude/**']
    paths: ['.github/workflows/tmp-ckan-discovery.yml']

jobs:
  discover:
    runs-on: ubuntu-24.04
    steps:
      - name: List resources of the drilling dataset and search for rig/well datasets
        run: |
          python3 - <<'PY'
          import json, urllib.request
          base = "http://datos.energia.gob.ar/api/3/action/"
          def get(path):
              with urllib.request.urlopen(base + path, timeout=60) as r:
                  return json.load(r)["result"]
          pkg = get("package_show?id=7ea2ac77-d7a0-4129-9fbf-6f1a25d94e21")
          print("DATASET", pkg["title"])
          for res in pkg["resources"]:
              print("RES", res["name"], "|", res["format"], "|", res["url"])
          for q in ("equipos", "perforacion", "pozos"):
              found = get("package_search?rows=30&q=" + q)
              for p in found["results"]:
                  print("SEARCH", q, "|", p["name"], "|", p["title"], "|", len(p["resources"]), "resources")
          PY
